[project]
name = "daily-pr-check"
version = "0.1.0"
requires-python = ">=3.12,<3.15"
dependencies = [
    "httpx>=0.28",
    "mistralai>=3.6.0",
    "mistralai-workflows[mistralai]>=3.17.1",
    "pydantic>=2.14.1",
]

[dependency-groups]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.25.3"]

[build-system]
requires = ["uv_build>=0.8.22,<0.9.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "worker"
module-root = "src"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
testpaths = ["tests"]
