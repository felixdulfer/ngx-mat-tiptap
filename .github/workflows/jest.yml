name: Test and Coverage

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.0.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Jest with coverage and report to PR
        uses: willcaul/jest-github-action@v4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # npm (not pnpm) here: this action appends extra jest flags via
          # `<test-command> -- <flags>`, and pnpm@9.x mishandles a bare
          # `--` (drops the args after it instead of stripping just the
          # `--`), so jest never receives --outputFile and never writes
          # jest.results.json. npm strips `--` correctly; dependencies are
          # already installed via pnpm above, npm just runs the script.
          test-command: npm run test:coverage
          # Keep default (false) to comment full coverage table
          coverage-comment: true
          # repo root (adjust if monorepo subdir is needed)
          working-directory: .
